services:
  postgres:
    image: postgres:17-alpine
    container_name: srrrg-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-srrrg}
      POSTGRES_USER: ${POSTGRES_USER:-srrrg}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-srrrg-local-password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  app:
    image: eclipse-temurin:21-jdk
    container_name: srrrg-app
    working_dir: /workspace
    restart: unless-stopped
    command: >
      sh -lc "exec sh ./gradlew --no-daemon bootRun"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-srrrg}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-srrrg}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-srrrg-local-password}
      SRRRG_BASE_URL: ${SRRRG_BASE_URL:-http://localhost:8080}
      SRRRG_TRUST_FORWARDED_HEADERS: ${SRRRG_TRUST_FORWARDED_HEADERS:-false}
    ports:
      - "${APP_PORT:-8080}:8080"
    volumes:
      - .:/workspace
      - gradle-cache:/root/.gradle
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
  gradle-cache:
