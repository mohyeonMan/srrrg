services:
  postgres:
    image: postgres:17-alpine
    container_name: srrrg-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-srrrg}
      POSTGRES_USER: ${POSTGRES_USER:-srrrg}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-srrrg-local-password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  app:
    image: eclipse-temurin:21-jdk
    container_name: srrrg-app
    working_dir: /workspace
    restart: unless-stopped
    command: >
      sh -lc "exec sh ./gradlew --no-daemon bootRun"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-srrrg}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-srrrg}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-srrrg-local-password}
      SRRRG_BASE_URL: ${SRRRG_BASE_URL:-http://localhost:8080}
      SRRRG_TRUST_FORWARDED_HEADERS: ${SRRRG_TRUST_FORWARDED_HEADERS:-false}
      SRRRG_JWT_ACTIVE_KID: ${SRRRG_JWT_ACTIVE_KID:-}
      SRRRG_JWT_ACTIVE_KEY_BASE64: ${SRRRG_JWT_ACTIVE_KEY_BASE64:-}
      SRRRG_JWT_PREVIOUS_KID: ${SRRRG_JWT_PREVIOUS_KID:-}
      SRRRG_JWT_PREVIOUS_KEY_BASE64: ${SRRRG_JWT_PREVIOUS_KEY_BASE64:-}
      GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID:-}
      GOOGLE_OAUTH_CLIENT_SECRET: ${GOOGLE_OAUTH_CLIENT_SECRET:-}
      KAKAO_OAUTH_CLIENT_ID: ${KAKAO_OAUTH_CLIENT_ID:-}
      KAKAO_OAUTH_CLIENT_SECRET: ${KAKAO_OAUTH_CLIENT_SECRET:-}
      GITHUB_OAUTH_CLIENT_ID: ${GITHUB_OAUTH_CLIENT_ID:-}
      GITHUB_OAUTH_CLIENT_SECRET: ${GITHUB_OAUTH_CLIENT_SECRET:-}
      SPRING_MAIL_HOST: ${SPRING_MAIL_HOST:-}
      SPRING_MAIL_PORT: ${SPRING_MAIL_PORT:-587}
      SPRING_MAIL_USERNAME: ${SPRING_MAIL_USERNAME:-}
      SPRING_MAIL_PASSWORD: ${SPRING_MAIL_PASSWORD:-}
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH: ${SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH:-true}
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE: ${SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE:-true}
      SRRRG_MAIL_FROM: ${SRRRG_MAIL_FROM:-}
      SRRRG_URL_RISK_PROVIDER: ${SRRRG_URL_RISK_PROVIDER:-google}
      SRRRG_URL_RISK_FIXED_SAFE_DELAY: ${SRRRG_URL_RISK_FIXED_SAFE_DELAY:-0ms}
      SRRRG_URL_RISK_FIXED_SAFE_CACHE_DURATION: ${SRRRG_URL_RISK_FIXED_SAFE_CACHE_DURATION:-5m}
    ports:
      - "${APP_PORT:-8080}:8080"
    volumes:
      - .:/workspace
      - gradle-cache:/root/.gradle
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
  gradle-cache:
