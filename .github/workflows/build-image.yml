name: Build and deploy image

on:
  push:
    branches:
      - dev
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/mohyeonman/srrrg
  INFRA_REPO: mohyeonMan/home-k3s-infra

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Test
        run: ./gradlew test

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        id: image
        env:
          TAG: sha-${{ github.sha }}
        run: |
          SHORT_TAG="sha-${GITHUB_SHA::7}"
          docker build -t "${IMAGE_NAME}:${SHORT_TAG}" -t "${IMAGE_NAME}:${TAG}" .
          docker push "${IMAGE_NAME}:${SHORT_TAG}"
          docker push "${IMAGE_NAME}:${TAG}"
          echo "tag=${SHORT_TAG}" >> "$GITHUB_OUTPUT"

      - name: Select deployment target
        id: target
        run: |
          if [ "${GITHUB_REF_NAME}" = "dev" ]; then
            echo "path=apps/srrrg/dev/app/kustomization.yaml" >> "$GITHUB_OUTPUT"
          elif [ "${GITHUB_REF_NAME}" = "main" ]; then
            echo "path=apps/srrrg/prod/app/kustomization.yaml" >> "$GITHUB_OUTPUT"
          else
            echo "Unsupported branch: ${GITHUB_REF_NAME}" >&2
            exit 1
          fi

      - name: Update infra image tag
        env:
          INFRA_TOKEN: ${{ secrets.INFRA_REPO_TOKEN }}
          IMAGE_TAG: ${{ steps.image.outputs.tag }}
          TARGET_PATH: ${{ steps.target.outputs.path }}
        run: |
          git clone "https://x-access-token:${INFRA_TOKEN}@github.com/${INFRA_REPO}.git" infra
          cd infra
          sed -i "s/newTag: .*/newTag: ${IMAGE_TAG}/" "${TARGET_PATH}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "${TARGET_PATH}"
          if git diff --cached --quiet; then
            echo "No infra changes to commit."
            exit 0
          fi
          git commit -m "chore(srrrg): deploy ${GITHUB_REF_NAME} ${IMAGE_TAG}"
          git push origin main
