<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>내 정보 - srrrg</title>
	<link rel="stylesheet" th:href="@{/css/srrrg.css}">
	<script defer th:src="@{/js/srrrg-account.js}"></script>
</head>
<body>
<div th:replace="~{fragments/srrrg-layout :: header}"></div>

<main id="account-app" class="page-shell account-shell"
	th:attr="data-account-url=@{/api/web/account},data-refresh-url=@{/api/web/auth/refresh},data-logout-url=@{/api/web/auth/logout},data-logout-all-url=@{/api/web/auth/logout-all},data-login-url=@{/login(returnTo='/account')},data-home-url=@{/}">
	<header class="account-heading">
		<p class="section-eyebrow">ACCOUNT</p>
		<h1>내 정보</h1>
		<p>계정 정보와 로그인된 세션을 관리합니다.</p>
	</header>

	<div class="account-grid">
		<section class="surface-panel account-card" aria-labelledby="profile-title">
			<div>
				<h2 id="profile-title">프로필</h2>
				<p>서비스에서 표시할 이름을 변경할 수 있습니다.</p>
			</div>
			<dl class="account-facts">
				<div><dt>이메일</dt><dd id="account-email">불러오는 중...</dd></div>
				<div><dt>연결 계정</dt><dd id="account-providers">불러오는 중...</dd></div>
			</dl>
			<form id="account-profile-form" class="form-grid" novalidate>
				<label class="field" for="account-display-name">
					<span class="field-label">이름</span>
					<input id="account-display-name" class="field-input" name="displayName" maxlength="100" required disabled>
				</label>
				<button class="primary-button" type="submit" disabled>변경사항 저장</button>
				<p id="account-message" class="form-message" role="status" aria-live="polite"></p>
			</form>
		</section>

		<section class="surface-panel account-card" aria-labelledby="session-title">
			<div>
				<h2 id="session-title">로그인 관리</h2>
				<p>현재 브라우저에서 로그아웃하거나 모든 기기의 로그인을 종료합니다.</p>
			</div>
			<div class="account-session-actions">
				<button id="account-logout" class="secondary-button" type="button">현재 기기에서 로그아웃</button>
				<button id="account-logout-all" class="danger-button" type="button">모든 기기에서 로그아웃</button>
			</div>
		</section>
	</div>
</main>

<div th:replace="~{fragments/srrrg-layout :: footer}"></div>
</body>
</html>
