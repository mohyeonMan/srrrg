<!--
	프로젝트 내부 전용 조각입니다. 단독 페이지로 렌더링하지 않습니다.
	포함하는 화면(projects.html)이 srrrg-common.js / srrrg-project-settings.js 를 불러옵니다.
-->
<div xmlns:th="http://www.thymeleaf.org" id="project-settings-app" th:fragment="workspace">
	<div class="campaign-heading-row">
		<h2 id="settings-project-name">프로젝트 설정</h2>
	</div>
	<p id="settings-message" class="form-message" role="status" aria-live="polite"></p>

	<section class="surface-panel project-card" aria-labelledby="rename-title">
		<h3 id="rename-title">프로젝트 이름</h3>
		<form id="rename-project-form" class="project-inline-form" novalidate>
			<label class="field" for="rename-project-name"><span class="field-label">프로젝트 이름</span><input id="rename-project-name" class="field-input" name="name" maxlength="100" required></label>
			<button class="primary-button" type="submit">이름 저장</button>
		</form>
	</section>

	<section class="surface-panel project-card" aria-labelledby="domain-title">
		<h3 id="domain-title">서브도메인</h3>
		<form id="change-project-domain-form" class="project-inline-form" novalidate>
			<!-- 버튼이 "선점" 이라고 말하므로 라벨에서 동작을 되풀이하지 않는다. -->
			<label class="field" for="change-project-domain"><span class="field-label">서브도메인</span><input id="change-project-domain" class="field-input" name="subdomain" minlength="3" maxlength="63" autocapitalize="none" autocomplete="off" spellcheck="false" required></label>
			<button class="primary-button" type="submit">선점</button>
		</form>

		<!-- 이전에는 .field(grid) 안에 라벨 + 체크박스 + "활성화" 를 넣어 셋이 각자 행으로 찢어졌다.
		     게다가 "신규 링크에 사용" 과 "활성화" 와 체크박스 자체가 같은 것을 세 번 말했다.
		     체크된 상태가 곧 활성화이므로 한 문장 한 줄로 합친다. -->
		<label class="checkbox-row" for="project-subdomain-enabled">
			<input id="project-subdomain-enabled" type="checkbox" aria-describedby="subdomain-availability">
			<span>새 링크를 이 서브도메인으로 발급</span>
		</label>

		<!-- 선점 전에는 체크박스와 반납이 비활성이다. 이유를 적어 두지 않으면 왜 회색인지 알 수 없다.
		     srrrg-project-settings.js 가 선점 상태에 따라 이 문구를 바꾼다. -->
		<p id="subdomain-availability" class="help-text"></p>
		<!-- 원래는 "활성화 여부와 관계없이 서브도메인은 선점됩니다" 로 내부 동작을 설명했는데
		     사용자가 그걸로 할 수 있는 행동이 없다. 실제로 알아야 하는 사실 하나만 남긴다. -->
		<p class="help-text">바꾸거나 반납해도 이미 만든 링크 주소는 그대로 동작합니다.</p>
		<button id="release-project-subdomain" class="text-button" type="button" aria-describedby="subdomain-availability">반납</button>
		<p id="domain-change-message" class="form-message" role="status" aria-live="polite"></p>
	</section>

	<section id="import-section" class="surface-panel project-card" aria-labelledby="import-title">
		<h3 id="import-title">기존 익명 링크 편입</h3>
		<p class="help-text">기존 링크의 code와 secret key를 입력하면 프로젝트 링크로 전환됩니다.</p>
		<form id="import-form" class="project-inline-form" novalidate>
			<label class="field" for="import-code"><span class="field-label">code</span><input id="import-code" class="field-input" name="code" maxlength="6" autocomplete="off" required></label>
			<label class="field" for="import-secret-key"><span class="field-label">secret key</span><input id="import-secret-key" class="field-input" name="secretKey" type="password" autocomplete="off" spellcheck="false" required></label>
			<button class="primary-button" type="submit">프로젝트로 편입</button>
		</form>
	</section>

	<section class="surface-panel project-card danger-zone" aria-labelledby="danger-zone-title">
		<h3 id="danger-zone-title">프로젝트 삭제</h3>
		<p class="help-text">삭제하면 프로젝트의 링크와 API key를 더 이상 사용할 수 없습니다.</p>
		<button id="delete-project-button" class="danger-button" type="button">프로젝트 삭제</button>
	</section>
</div>
