<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>srrrg - 링크 확인</title>
	<link rel="stylesheet" th:href="@{/css/srrrg.css}">
	<script defer th:src="@{/js/redirect-confirm.js}"></script>
</head>
<body>
<div th:replace="~{fragments/srrrg-layout :: header}"></div>

<main class="decision-shell">
	<section class="decision-panel" aria-labelledby="confirm-title">
		<div class="decision-heading">
			<span class="section-eyebrow">이동 전 확인</span>
			<h1 id="confirm-title" class="page-title">신뢰할 수 있는 링크인가요?</h1>
			<p class="page-description">이 단축 링크는 자동 이동 대상이 아닙니다. 원본 주소를 확인한 뒤 이동하세요.</p>
		</div>

		<section class="data-section" aria-labelledby="original-domain-label">
			<h2 id="original-domain-label" class="data-label">원본 도메인</h2>
			<p class="domain-value" th:text="${originalUrlHost}">example.com</p>
		</section>

		<section class="data-section" aria-labelledby="original-url-label">
			<h2 id="original-url-label" class="data-label">원본 URL</h2>
			<div class="url-reveal">
				<p id="original-url-summary" class="url-box" th:text="${originalUrlSummary}">https://example.com/...</p>
				<p id="original-url-full" class="url-box" th:text="${originalUrl}" hidden>https://example.com/path?query=value</p>
				<button id="original-url-toggle" class="secondary-button" type="button" aria-controls="original-url-full" aria-expanded="false">전체 URL 보기</button>
			</div>
		</section>

		<section class="data-section" aria-labelledby="short-url-label">
			<h2 id="short-url-label" class="data-label">단축 URL</h2>
			<p class="url-box" th:text="${shortUrl}">https://srrrg.link/abc123</p>
		</section>

		<div class="action-row">
			<form th:action="@{/{code}/redirect(code=${code})}" method="post">
				<button class="primary-button" type="submit">원본 URL로 이동</button>
			</form>
			<button id="go-back-button" class="secondary-button" type="button" th:attr="data-fallback-url=@{/}">돌아가기</button>
		</div>
	</section>
</main>

<div th:replace="~{fragments/srrrg-layout :: footer}"></div>
</body>
</html>
