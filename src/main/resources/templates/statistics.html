<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
	<title>srrrg - 통계</title>
	<link rel="stylesheet" th:href="@{/css/srrrg.css}">
	<link rel="stylesheet" th:href="@{/css/srrrg/management.css}">
	<link rel="stylesheet" th:href="@{/css/srrrg/statistics.css}">
	<script defer th:src="@{/js/srrrg-statistics.js}"></script>
</head>
<body>
<div th:replace="~{fragments/srrrg-layout :: header}"></div>
<main id="statistics-app" class="management-shell" th:attr="data-base=@{/}">
	<header class="console-header"><p class="section-kicker">STATISTICS</p><h1 id="statistics-title">통계</h1><p id="statistics-message" role="status">통계를 불러오는 중입니다.</p></header>
	<section class="console-panel analytics-panel">
		<form id="statistics-filter" class="statistics-filter">
			<div class="period-control" role="group" aria-label="빠른 기간"><button type="button" data-days="7">7일</button><button type="button" data-days="30">30일</button><button type="button" data-days="90">90일</button></div>
			<label>시작일 <input id="statistics-from" type="date" required></label>
			<label>종료일 <input id="statistics-to" type="date" required></label>
			<label>집계 <select id="statistics-bucket"><option value="DAY">일</option><option value="MONTH">월</option><option value="YEAR">년</option></select></label>
			<button class="primary-button compact-action" type="submit">적용</button>
		</form>
		<dl class="metric-grid" aria-label="기간 핵심 통계">
			<div class="metric-item"><dt>접근</dt><dd id="stat-entries">0</dd><p id="stat-entries-delta">-</p></div>
			<div class="metric-item"><dt>이동</dt><dd id="stat-redirects">0</dd><p id="stat-redirects-delta">-</p></div>
			<div class="metric-item"><dt>미이동</dt><dd id="stat-nonredirects">0</dd><p>접근 - 이동</p></div>
			<div class="metric-item"><dt>봇</dt><dd id="stat-bots">0</dd><p id="stat-bot-share">-</p></div>
		</dl>
		<section class="analytics-section"><div class="analytics-section-heading"><div><h2>접근 추이</h2><p>선택한 일·월·년 단위의 접근과 이동입니다.</p></div><div class="chart-legend" aria-hidden="true"><span class="entries">접근</span><span class="redirects">이동</span></div></div><div class="trend-chart-wrap"><svg id="statistics-trend" class="trend-chart" viewBox="0 0 960 300" role="img" aria-label="접근 및 이동 추이"></svg></div></section>
		<div class="analytics-breakdowns"><section class="analytics-section"><div class="analytics-section-heading"><div><h2>결과</h2></div></div><div id="statistics-outcomes" class="breakdown-list"></div></section><section class="analytics-section"><div class="analytics-section-heading"><div><h2>유입 도메인</h2></div></div><div id="statistics-referrers" class="breakdown-list"></div></section></div>
		<section id="link-status-section" class="analytics-section" hidden><div class="analytics-section-heading"><div><h2>링크 확인 상태</h2><p>비봇 접근 있음 / 봇만 접근 / 접근 없음 기준입니다.</p></div></div><div id="link-status-summary" class="status-summary"></div><div id="statistics-links-wrap" class="data-table-wrap"><table class="activity-table"><thead><tr><th>링크</th><th>external_id</th><th>목적지</th><th>상태</th><th>접근</th><th>이동</th><th>최근 접근</th></tr></thead><tbody id="statistics-links"></tbody></table></div></section>
		<section id="utm-section" class="analytics-section" hidden><div class="analytics-section-heading"><div><h2>UTM별 성과</h2><p>필드와 값별 링크 수 및 선택 기간 접근입니다.</p></div></div><div id="utm-chart" class="breakdown-list"></div><div class="data-table-wrap"><table class="activity-table"><thead><tr><th>필드</th><th>값</th><th>링크</th><th>확인 링크</th><th>봇 전용</th><th>접근</th><th>이동</th></tr></thead><tbody id="statistics-utm"></tbody></table></div></section>
		<section id="campaign-section" class="analytics-section" hidden><div class="analytics-section-heading"><div><h2>캠페인 비교</h2></div></div><div id="campaign-chart" class="breakdown-list"></div><div class="data-table-wrap"><table class="activity-table"><thead><tr><th>캠페인</th><th>링크</th><th>접근</th><th>이동</th></tr></thead><tbody id="statistics-campaigns"></tbody></table></div></section>
	</section>
</main>
<div th:replace="~{fragments/srrrg-layout :: footer}"></div>
</body></html>
