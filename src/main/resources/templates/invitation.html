<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>srrrg - 프로젝트 초대</title><link rel="stylesheet" th:href="@{/css/srrrg.css}"></head><body><main class="management-shell"><section class="management-gate"><h1>프로젝트 초대</h1><p>로그인한 계정으로 이 프로젝트 초대에 응합니다.</p><button id="accept" class="primary-button">초대 수락</button><p id="message" class="form-message" role="status"></p><p>로그인이 필요하면 <a th:href="@{'/oauth2/authorization/google?returnTo=/invitations/' + ${token}}">Google</a>, <a th:href="@{'/oauth2/authorization/kakao?returnTo=/invitations/' + ${token}}">Kakao</a>, <a th:href="@{'/oauth2/authorization/github?returnTo=/invitations/' + ${token}}">GitHub</a>로 로그인하세요.</p></section></main><script th:inline="javascript">const t = /*[[${token}]]*/ ''; document.querySelector('#accept').onclick=async()=>{const c=document.cookie.match(/XSRF-TOKEN=([^;]+)/)?.[1];const r=await fetch('/api/web/invitations/'+encodeURIComponent(t)+'/accept',{method:'POST',headers:{'X-XSRF-TOKEN':c||''}});document.querySelector('#message').textContent=r.ok?'초대를 수락했습니다.':'로그인 후 다시 시도하거나 초대 상태를 확인하세요.'};</script></body></html>
