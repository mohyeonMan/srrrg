<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<meta name="context-path" th:content="@{/}">
	<title>srrrg - 프로젝트</title>
	<link rel="stylesheet" th:href="@{/css/srrrg.css}">
	<link rel="stylesheet" th:href="@{/css/srrrg/management.css}">
	<link rel="stylesheet" th:href="@{/css/srrrg/statistics.css}">
	<!-- srrrg-projects.js 는 맨 뒤에 싣는다. 이 파일이 탭을 묶으면서 각 패널 조각의
	     window.SrrrgProjectX.reload() 를 부르는데, 앞에 있으면 그 조각들이 아직 실행되지 않은
	     상태로 첫 탭의 지연 조회가 일어나 ?. 가 조용히 넘어간다(?tab=settings 로 들어오면 빈 패널).
	     defer 는 문서 순서대로 실행되므로 순서만 바꾸면 이 경쟁이 사라진다. -->
	<script defer th:src="@{/js/srrrg-common.js}"></script>
	<script defer th:src="@{/js/srrrg-statistics.js}"></script>
	<script defer th:src="@{/js/srrrg-campaigns.js}"></script>
	<script defer th:src="@{/js/srrrg-project-utm-templates.js}"></script>
	<script defer th:src="@{/js/srrrg-project-api-keys.js}"></script>
	<script defer th:src="@{/js/srrrg-project-settings.js}"></script>
	<script defer th:src="@{/js/srrrg-project-members.js}"></script>
	<script defer th:src="@{/js/srrrg-management.js}"></script>
	<script defer th:src="@{/js/srrrg-projects.js}"></script>
</head>
<body>
<div th:replace="~{fragments/srrrg-layout :: header}"></div>

<main class="projects-shell" id="projects-app">
	<header class="projects-heading">
		<div>
			<div class="project-heading-controls">
				<h1><a id="project-heading-name" href="#">프로젝트</a></h1>
				<span id="project-role" class="status-badge"></span>
				<details class="project-picker-menu">
					<summary aria-label="프로젝트 선택" title="프로젝트 선택">▾</summary>
					<div id="project-picker" class="project-picker-options" role="menu" aria-label="내 프로젝트"></div>
				</details>
				<button id="open-create-project" class="project-heading-button" type="button"
						aria-label="새 프로젝트 만들기" title="새 프로젝트 만들기">+</button>
			</div>
			<!-- "팀과 함께 쓰는 단축 URL을 프로젝트 도메인에서 만들고 관리하세요" 를 지웠다.
			     이미 프로젝트 안에서 작업하는 사람에게 제품을 소개하는 문장이고
			     여기서 얻는 행동이 없다. 모바일에서는 한 줄을 그냥 차지한다. -->
		</div>
		<!-- 생성은 헤딩에 둔다. .projects-heading 은 .projects-layout 바깥이라
		     캠페인·링크·설정 어느 화면에서도 보이므로 여기가 항상 1클릭이다.
		     이전에는 레일 항목이었고, 누르면 개요와 탭 바가 사라지는 화면으로 바뀌었다. -->
		<div id="project-create-actions" class="project-create-actions" hidden>
			<button id="open-create-link" class="primary-button compact-action" type="button">링크 만들기</button>
			<button id="open-create-campaign" class="secondary-button compact-action" type="button">캠페인 만들기</button>
		</div>
	</header>
	<p id="project-message" class="form-message" role="status" aria-live="polite"></p>

	<dialog id="create-project-dialog" class="project-create-dialog" aria-labelledby="create-project-title">
		<div class="project-dialog-heading">
			<h2 id="create-project-title">새 프로젝트</h2>
			<button id="close-create-project" type="button" aria-label="닫기">×</button>
		</div>
		<form id="create-project-form" class="form-grid" novalidate>
			<label class="field" for="new-project-name">
				<span class="field-label">프로젝트 이름</span>
				<input id="new-project-name" class="field-input" name="name" maxlength="100" autocomplete="off" aria-describedby="project-message" required>
			</label>
			<button class="primary-button" type="submit">프로젝트 만들기</button>
			<p id="create-project-message" class="form-message" role="status" aria-live="polite"></p>
		</form>
	</dialog>

	<button id="open-rail" class="rail-toggle" type="button" aria-expanded="false" aria-controls="project-rail">
		<span aria-hidden="true">☰</span> 프로젝트 메뉴
	</button>

	<!-- 삭제·반납처럼 되돌리기 어려운 동작의 공용 확인 대화상자.
	     SrrrgCommon.confirmAction() 이 채워서 showModal() 로 띄운다. -->
	<dialog id="confirm-dialog" class="project-create-dialog" aria-labelledby="confirm-dialog-title">
		<div class="project-dialog-heading">
			<h2 id="confirm-dialog-title">확인</h2>
		</div>
		<p id="confirm-dialog-body" class="help-text"></p>
		<div class="project-form-actions confirm-dialog-actions">
			<button id="confirm-dialog-cancel" class="secondary-button" type="button">취소</button>
			<button id="confirm-dialog-accept" class="danger-button" type="button">삭제</button>
		</div>
	</dialog>

	<!-- 생성은 대화상자다. 판으로 두던 동안에는 열 때마다 개요·통계·탭 바가 숨겨져
	     프로젝트 안에서 길을 잃었다. 필드 2개 + 만료 옵션으로 끝나는 단발 작업이라
	     머무는 작업공간(캠페인의 대량 생성 탭)과 성격이 다르다.

	     #project-detail 안이 아니라 페이지 수준에 둔다. 그 안에 두면 캠페인·링크·설정
	     화면에서 #project-detail 이 hidden(display:none) 이 되어 대화상자가 렌더되지 않는다. -->
	<dialog id="create-link-dialog" class="project-create-dialog" aria-labelledby="link-create-title">
		<div class="project-dialog-heading">
			<h2 id="link-create-title">링크 만들기</h2>
			<button id="close-create-link" type="button" aria-label="닫기">×</button>
		</div>
		<!-- 무엇이 만들어지는지 밝힌다. 프로젝트 레벨과 캠페인 레벨의 "링크 만들기" 가
		     서로 다른 것을 만드는데(단일링크 vs 캠페인 링크) 문구가 그 차이를 말하지 않았다.
		     "단일링크" 는 레일 필터와 프로젝트 요약이 이미 쓰는 표현이다. -->
		<p class="help-text">캠페인에 속하지 않는 단일링크를 이 프로젝트 도메인으로 만듭니다.</p>

		<form id="create-project-link-form" class="form-grid" novalidate>
			<label class="field" for="project-link-name">
				<span class="field-label">이름 (선택)</span>
				<input id="project-link-name" class="field-input" name="name" maxlength="100" placeholder="예: 여름 프로모션">
			</label>
			<label class="field" for="project-original-url">
				<span class="field-label">원본 URL</span>
				<input id="project-original-url" class="field-input" name="originalUrl" type="url" maxlength="2048" placeholder="https://example.com/very/long/path" aria-describedby="project-url-error link-create-message" required>
				<span id="project-url-error" class="field-error" hidden></span>
			</label>

			<fieldset id="project-expire-options" class="expire-options" aria-describedby="project-expiration-error">
				<legend>만료 시각</legend>
				<button class="quick-expire-option" type="button" data-expires-option="none" aria-pressed="true">없음</button>
				<button class="quick-expire-option" type="button" data-expires-option="1:hours" aria-pressed="false">1시간</button>
				<button class="quick-expire-option" type="button" data-expires-option="1:days" aria-pressed="false">하루</button>
				<button class="quick-expire-option" type="button" data-expires-option="1:months" aria-pressed="false">1개월</button>
				<button class="quick-expire-option" type="button" data-expires-option="1:years" aria-pressed="false">1년</button>
				<button class="quick-expire-option" type="button" data-expires-option="custom" aria-pressed="false">직접 입력</button>
			</fieldset>
			<label id="project-custom-expiration-field" class="field" for="project-expires-at" hidden>
				<span class="field-label">직접 입력</span>
				<input id="project-expires-at" class="field-input" name="expiresAt" type="datetime-local" aria-describedby="project-expiration-error">
			</label>
			<span id="project-expiration-error" class="field-error" hidden></span>

			<div class="project-form-actions">
				<p id="link-create-message" class="form-message" role="status" aria-live="polite"></p>
				<!-- CTA·제목이 "링크 만들기" 인데 제출만 "단축 URL 만들기" 여서
				     한 흐름에서 같은 대상을 두 이름으로 불렀다. 캠페인 대화상자와 같이 제목과 맞춘다.
				     홈의 익명 단축기는 자기 맥락이 있어 "단축 URL 만들기" 를 그대로 둔다. -->
				<button id="create-project-link-button" class="primary-button" type="submit" disabled>링크 만들기</button>
			</div>
		</form>

		<!-- 결과는 대화상자 안에서 보여 준다. 닫으면 보고 있던 탭이 그대로 남는다. -->
		<section id="project-link-result" class="project-link-result" aria-labelledby="project-link-result-title" hidden>
			<span class="status-badge success">생성 완료</span>
			<h3 id="project-link-result-title" tabindex="-1">단축 URL이 준비됐어요</h3>
			<div class="copy-row">
				<a id="created-project-link" class="url-box" target="_blank" rel="noopener noreferrer"></a>
				<button id="copy-created-project-link" class="copy-button" type="button">복사</button>
			</div>
		</section>
	</dialog>

	<dialog id="create-campaign-dialog" class="project-create-dialog" aria-labelledby="campaign-create-title">
		<div class="project-dialog-heading">
			<h2 id="campaign-create-title">캠페인 만들기</h2>
			<button id="close-create-campaign" type="button" aria-label="닫기">×</button>
		</div>
		<p class="help-text">관련 단축링크와 UTM 설정을 하나의 캠페인으로 관리합니다.</p>
		<form id="create-campaign-form" class="form-grid" novalidate>
			<label class="field" for="new-campaign-name"><span class="field-label">새 캠페인 이름</span><input id="new-campaign-name" class="field-input" name="name" maxlength="100" required></label>
			<label class="field" for="new-campaign-default-url"><span class="field-label">기본 목적지 URL (선택)</span><input id="new-campaign-default-url" class="field-input" name="defaultOriginalUrl" type="url" maxlength="2048"></label>
			<label class="field" for="new-campaign-template"><span class="field-label">UTM 템플릿 (선택)</span>
				<select id="new-campaign-template" class="field-input" name="utmTemplateId">
					<option value="">템플릿 없음</option>
				</select>
			</label>
			<button class="primary-button" type="submit">캠페인 만들기</button>
		</form>
		<p id="campaign-message" class="form-message" role="status" aria-live="polite"></p>
	</dialog>

	<div id="rail-scrim" class="rail-scrim" hidden></div>

	<div class="projects-layout">
		<aside id="project-rail" class="project-rail surface-panel" aria-label="프로젝트 탐색">
			<button id="close-rail" class="rail-close" type="button">닫기</button>
			<!-- 이 항목들은 전부 .project-activity-item 이었다 — 아래 콘텐츠 목록의 캠페인 항목과
			     같은 클래스라서 "만들기"(동작)와 "캠페인"(객체)이 같은 옷을 입고 있었다.
			     생성 둘은 헤딩 CTA 로 옮겼고(어차피 헤딩이 모든 화면에서 보여 여기 둘 이유가 없다),
			     남은 셋은 섹션으로 가는 이동 수단이라 글리프 배지를 버리고 별도 종으로 둔다. -->
			<p class="project-rail-label">프로젝트 관리</p>
			<nav class="project-rail-actions" aria-label="프로젝트 섹션">
				<a id="project-templates-nav" class="project-rail-shortcut" href="#">UTM 템플릿</a>
				<a id="project-api-nav" class="project-rail-shortcut" href="#" hidden>API 키</a>
				<a id="project-settings-nav" class="project-rail-shortcut" href="#">프로젝트 설정</a>
			</nav>
			<div class="project-activity-heading">
				<span>콘텐츠</span>
				<div class="project-activity-controls">
					<button id="project-activity-filter" type="button" aria-label="콘텐츠 종류: 전체">전체</button>
					<button id="project-activity-sort" type="button" aria-label="콘텐츠 정렬: 최신순">최신순</button>
				</div>
			</div>
			<div class="project-activity-scroll">
				<nav id="project-activity-list" class="project-activity-list" aria-label="캠페인과 단일 링크"></nav>
			</div>
		</aside>

		<!-- 이 컨테이너에 aria-live 를 두면 내부 form-message 12개가 이중 announce 되고
		     패널 전환 때 서브트리 전체가 읽힙니다. 개별 form-message 가 role="status" 를
		     이미 갖고 있으므로 컨테이너 단위 라이브 리전은 두지 않습니다. -->
		<section class="project-workspace">
			<!-- 이 패널은 프로젝트가 0개일 때만 보인다(하나라도 있으면 자동 선택됨).
			     따라서 "선택하세요"가 아니라 왜 비었는지와 다음 행동을 안내한다. -->
			<div id="project-empty" class="project-empty surface-panel">
				<h2>아직 프로젝트가 없습니다</h2>
				<!-- 빈 상태에서는 설명이 제 일을 하지만 세 가지를 한 호흡에 말하고 있었다.
				     버튼을 누를지 정하는 데 필요한 두 가지만 남긴다. UTM 템플릿은 안에서 발견된다. -->
				<p>팀이 함께 쓰는 작업 공간입니다. 만들면 전용 도메인으로 링크를 만들고 캠페인별 성과를 볼 수 있습니다.</p>
				<button id="create-first-project" class="primary-button" type="button">첫 프로젝트 만들기</button>
			</div>

			<div id="project-detail" class="project-detail" hidden>
				<!--
					이 줄은 상태만 알린다. 다음 행동(링크·캠페인 만들기, 항목 열기)은 전부 왼쪽 레일에 있어서
					여기에 버튼을 두면 같은 행동의 두 번째 입구가 된다.

					도메인 옆 복사 버튼을 없앴다. 주소가 보인다는 이유로 붙어 있었지만,
					origin 만으로는 아무 곳에도 쓸 수 없다 — 링크는 코드가 붙어야 주소가 되고,
					실제 복사는 생성 결과와 링크 목록의 행별 복사가 담당한다.
					여기서 도메인의 역할은 "이 프로젝트의 새 링크가 어느 주소로 발급되는가" 라는 사실 확인이다.

					"왼쪽 목록에서 열 수 있습니다" 안내도 지웠다. 레일이 화면에 보이고 항목이 링크로
					렌더되므로 조작 방법을 문장으로 설명할 필요가 없다.
				-->
				<section id="project-home-panel" class="project-summary surface-panel" aria-labelledby="project-home-title">
					<h2 id="project-home-title" class="sr-only">프로젝트 요약</h2>
					<dl class="project-summary-facts">
						<div>
							<dt>단일링크</dt>
							<dd id="project-link-count">0</dd>
						</div>
						<div>
							<dt>캠페인</dt>
							<dd id="campaign-count">0</dd>
						</div>
						<div class="project-summary-domain">
							<dt>발급 도메인</dt>
							<dd id="project-domain" class="project-domain">불러오는 중</dd>
						</div>
					</dl>
				</section>

				<!-- 이전에는 "프로젝트 개요" 카드 하나에 통계 리포트 전체와 멤버 관리가 함께 들어가
				     카드 높이의 84%(2035px 중 1717px)를 통계가 차지하고, h2 개요 > h3 통계 > h4 5개로
				     위계가 뒤집혀 있었다. 캠페인 상세와 같은 console-tabs 를 재사용해 나눈다.
				     기본 탭은 통계다 — 워크스페이스에 들어오면 먼저 데이터가 보여야 한다.
				     조각들이 이미 자기 surface-panel 을 들고 오므로 탭 패널에 카드 클래스를 겹치지 않는다. -->
				<!-- 프로젝트의 다섯 면. UTM·설정은 예전에 view= 파라미터로 #project-detail 을 통째로
				     대체하는 별도 화면이었다. 그래서 프로젝트 레벨만 캠페인·링크 레벨과 문법이 달랐고
				     (그 둘은 설정을 탭으로 갖는다) 무엇으로 구성된 프로젝트인지 한눈에 보이지 않았다.
				     같은 위계를 한 축(?tab=)으로 통일한다.

				     "통계" 라는 탭은 없애고 개요가 통계를 품는다 — 기본 탭이 이미 통계였으므로
				     들어왔을 때 보이는 화면은 그대로다.
				     라벨은 "멤버 관리"·"UTM 관리" 가 아니라 짧게 쓴다. API 탭을 포함해도 320px 에서
				     탭 하나에 약 49px 이 돌아가므로 아래 다섯 라벨은 한 줄을 유지한다. 모든 탭이 관리이므로
				     접미사는 정보를 더하지 않는다. 맥락은 각 패널 제목이 말한다. -->
				<div id="project-view-tabs" class="console-tabs" role="tablist" aria-label="프로젝트 화면"
					th:if="${param.campaignId == null and param.linkCode == null}">
					<button id="project-tab-overview" class="console-tab" type="button" role="tab" aria-selected="true" aria-controls="project-panel-overview">개요</button>
					<button id="project-tab-members" class="console-tab" type="button" role="tab" aria-selected="false" aria-controls="project-panel-members">멤버</button>
					<button id="project-tab-utm" class="console-tab" type="button" role="tab" aria-selected="false" aria-controls="project-panel-utm">UTM</button>
					<button id="project-tab-api" class="console-tab" type="button" role="tab" aria-selected="false" aria-controls="project-panel-api" hidden>API</button>
					<button id="project-tab-settings" class="console-tab" type="button" role="tab" aria-selected="false" aria-controls="project-panel-settings">설정</button>
				</div>

				<section id="project-panel-overview" role="tabpanel" aria-labelledby="project-tab-overview"
					th:if="${param.campaignId == null and param.linkCode == null}">
					<div th:replace="~{statistics :: report}"></div>
				</section>

				<section id="project-panel-members" role="tabpanel" aria-labelledby="project-tab-members" hidden
					th:if="${param.campaignId == null and param.linkCode == null}">
					<div th:replace="~{project-members :: report}"></div>
				</section>

				<section id="project-panel-utm" role="tabpanel" aria-labelledby="project-tab-utm" hidden
					th:if="${param.campaignId == null and param.linkCode == null}">
					<div th:replace="~{project-utm-templates :: workspace}"></div>
				</section>

				<section id="project-panel-api" role="tabpanel" aria-labelledby="project-tab-api" hidden
					th:if="${param.campaignId == null and param.linkCode == null}">
					<div th:replace="~{project-api-keys :: workspace}"></div>
				</section>

				<section id="project-panel-settings" role="tabpanel" aria-labelledby="project-tab-settings" hidden
					th:if="${param.campaignId == null and param.linkCode == null}">
					<div th:replace="~{project-settings :: workspace}"></div>
				</section>

			</div>

			<section id="project-campaign-view" class="project-campaign-view" th:if="${param.campaignId != null and param.linkCode == null}">
				<div th:replace="~{campaigns :: workspace}"></div>
			</section>

			<section id="project-link-view" class="project-link-view" th:if="${param.linkCode != null}">
				<div th:replace="~{management :: workspace}"></div>
			</section>

		</section>
	</div>
</main>

<div th:replace="~{fragments/srrrg-layout :: footer}"></div>
</body>
</html>
