<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>srrrg - 프로젝트</title><link rel="stylesheet" th:href="@{/css/srrrg.css}"><script defer th:src="@{/js/srrrg-projects.js}"></script></head>
<body><div th:replace="~{fragments/srrrg-layout :: header}"></div><main class="management-shell" id="projects-app">
<section class="management-gate"><p class="section-kicker">PROJECTS</p><h1>프로젝트와 멤버</h1><p>프로젝트별로 링크와 멤버를 관리합니다.</p>
<form id="create-project-form"><label class="field"><span class="field-label">새 프로젝트 이름</span><input class="field-input" name="name" maxlength="100" required></label><button class="primary-button">프로젝트 만들기</button></form><p id="project-message" class="form-message" role="status"></p>
</section><section class="management-console"><h2>내 프로젝트</h2><div id="project-list"></div><div id="project-detail" hidden><h2 id="project-name"></h2><h3>멤버</h3><div id="member-list"></div><form id="invite-form"><label class="field"><span class="field-label">초대할 이메일</span><input class="field-input" name="email" type="email" required></label><label class="field"><span class="field-label">역할</span><select class="field-input" name="role"><option value="EDITOR">EDITOR</option><option value="VIEWER">VIEWER</option></select></label><button class="primary-button">이메일 초대 보내기</button></form><h3>보낸 초대</h3><div id="invitation-list"></div><h3>기존 익명 링크 편입</h3><form id="import-form"><label class="field"><span class="field-label">코드</span><input class="field-input" name="code" maxlength="6" required></label><label class="field"><span class="field-label">secret key</span><input class="field-input" name="secretKey" type="password" required></label><button class="secondary-button">프로젝트로 편입</button></form></div></section>
</main><div th:replace="~{fragments/srrrg-layout :: footer}"></div></body></html>
