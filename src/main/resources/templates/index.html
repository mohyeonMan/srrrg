<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>srrrg - 빠르고 안전한 단축 URL</title>
	<link rel="stylesheet" th:href="@{/css/srrrg.css}">
	<script defer th:src="@{/js/srrrg-home.js}"></script>
</head>
<body>
<div th:replace="~{fragments/srrrg-layout :: header}"></div>

<main id="home-app" class="page-shell" th:attr="data-api-url=@{/api/links},data-manage-url=@{/manage}">
	<section class="home-hero">
		<div th:replace="~{fragments/home/product-intro :: productIntro}"></div>
		<div th:replace="~{fragments/home/create-panel :: createPanel}"></div>
	</section>

	<div th:replace="~{fragments/home/trust-features :: trustFeatures}"></div>
	<div th:replace="~{fragments/home/manage-entry :: manageEntry}"></div>
</main>

<div th:replace="~{fragments/srrrg-layout :: footer}"></div>
</body>
</html>
