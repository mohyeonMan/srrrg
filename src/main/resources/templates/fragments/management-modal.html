<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<body>
<div id="management-modal" class="management-modal" role="dialog" aria-modal="true" aria-labelledby="management-modal-title" th:fragment="managementModal">
	<div class="management-modal-panel">
		<header class="management-modal-header">
			<div class="management-modal-title-block">
				<span id="management-status-badge" class="status-badge success">사용 가능</span>
				<h2 id="management-modal-title" class="management-modal-title">내 단축 링크 관리</h2>
			</div>
			<button id="management-modal-close-button" class="management-modal-close" type="button" aria-label="닫기">×</button>
		</header>

		<div class="management-detail">
			<section class="management-link-block" aria-labelledby="management-short-url-label">
				<p id="management-short-url-label" class="data-label">단축 URL</p>
				<div class="copy-row">
					<a id="management-short-url" class="management-link url-box" target="_blank" rel="noopener noreferrer"></a>
					<button id="copy-management-short-url" class="copy-button" type="button" aria-label="관리 단축 URL 복사">복사</button>
				</div>
			</section>

			<div class="management-stats" aria-label="링크 누적 통계">
				<div class="management-stat">
					<p class="management-stat-label">클릭 수</p>
					<p id="management-click-count" class="management-stat-value">0</p>
				</div>
				<div class="management-stat">
					<p class="management-stat-label">실제 이동 수</p>
					<p id="management-redirect-count" class="management-stat-value">0</p>
				</div>
			</div>

			<dl class="management-meta">
				<div>
					<dt>만료 상태</dt>
					<dd id="management-expiration-status">-</dd>
				</div>
				<div>
					<dt>생성 시각</dt>
					<dd id="management-created-at">-</dd>
				</div>
				<div>
					<dt>최근 수정</dt>
					<dd id="management-updated-at">-</dd>
				</div>
			</dl>

			<form id="management-edit-form" class="management-edit-form" autocomplete="off" novalidate>
				<div class="field">
					<label class="field-label" for="management-original-url">원본 URL</label>
					<div class="management-field-row">
						<input id="management-original-url" class="field-input" type="url" maxlength="2048" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false" aria-describedby="management-modal-message" required>
						<button id="management-original-url-reset-button" class="secondary-button field-reset-button" type="button" disabled>초기화</button>
					</div>
				</div>
				<div class="field management-expire-field">
					<fieldset class="expire-options management-expire-options" aria-describedby="management-modal-message">
						<legend>만료 시각</legend>
						<button class="quick-expire-option" type="button" data-management-expires-option="none" aria-pressed="true">없음</button>
						<button class="quick-expire-option" type="button" data-management-expires-option="1:hours" aria-pressed="false">1시간</button>
						<button class="quick-expire-option" type="button" data-management-expires-option="1:days" aria-pressed="false">하루</button>
						<button class="quick-expire-option" type="button" data-management-expires-option="1:months" aria-pressed="false">1개월</button>
						<button class="quick-expire-option" type="button" data-management-expires-option="1:years" aria-pressed="false">1년</button>
						<button class="quick-expire-option" type="button" data-management-expires-option="custom" aria-pressed="false">직접 입력</button>
					</fieldset>
					<div id="management-expires-field" class="field expire-value-field">
						<div class="management-field-row">
							<input id="management-expires-at" class="field-input" type="text" value="-" autocomplete="off" aria-label="만료 시각" aria-describedby="management-modal-message" disabled>
							<button id="management-expires-at-reset-button" class="secondary-button field-reset-button" type="button" disabled>초기화</button>
						</div>
					</div>
				</div>

				<p id="management-modal-message" class="management-message" role="status" aria-live="polite"></p>
				<div class="management-actions">
					<button id="management-save-button" class="primary-button" type="submit" disabled>변경 저장</button>
					<button id="management-delete-button" class="danger-button" type="button">링크 삭제</button>
				</div>
			</form>
		</div>
	</div>
</div>
</body>
</html>
