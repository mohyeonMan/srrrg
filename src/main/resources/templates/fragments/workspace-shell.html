<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<body>
<aside class="workspace-sidebar" th:fragment="sidebar(active)">
	<a class="workspace-brand" th:href="@{/}" aria-label="srrrg 홈">
		<span class="srrrg-logo">srrrg</span>
	</a>

	<nav class="sidebar-nav" aria-label="프로젝트 메뉴">
		<a class="sidebar-nav-item" data-preserve-project
				th:classappend="${active == 'projects'} ? ' is-active'"
				th:attr="aria-current=${active == 'projects'} ? 'page' : null"
				th:href="@{/projects}">프로젝트</a>
		<a class="sidebar-nav-item" data-preserve-project
				th:classappend="${active == 'campaigns'} ? ' is-active'"
				th:attr="aria-current=${active == 'campaigns'} ? 'page' : null"
				th:href="@{/campaigns}">캠페인</a>
		<a class="sidebar-nav-item" data-preserve-project
				th:classappend="${active == 'utm-templates'} ? ' is-active'"
				th:attr="aria-current=${active == 'utm-templates'} ? 'page' : null"
				th:href="@{/projects/utm-templates}">UTM 템플릿</a>
		<a class="sidebar-nav-item" data-preserve-project
				th:classappend="${active == 'statistics'} ? ' is-active'"
				th:attr="aria-current=${active == 'statistics'} ? 'page' : null"
				th:href="@{/statistics}">통계</a>
	</nav>

	<nav class="sidebar-nav sidebar-nav-secondary" aria-label="프로젝트 관리">
		<a class="sidebar-nav-item" data-preserve-project
				th:classappend="${active == 'members'} ? ' is-active'"
				th:attr="aria-current=${active == 'members'} ? 'page' : null"
				th:href="@{/projects/members}">멤버</a>
		<a class="sidebar-nav-item" data-preserve-project
				th:classappend="${active == 'settings'} ? ' is-active'"
				th:attr="aria-current=${active == 'settings'} ? 'page' : null"
				th:href="@{/projects/settings}">설정</a>
	</nav>

	<nav class="sidebar-nav sidebar-nav-secondary sidebar-nav-utility" aria-label="비회원 도구">
		<a class="sidebar-nav-item" th:href="@{/manage}">비회원 링크 관리</a>
	</nav>
</aside>

<header class="workspace-topbar" th:fragment="topbar(title)">
	<h1 class="workspace-topbar-title" th:text="${title}">프로젝트</h1>
	<a class="text-link workspace-topbar-home" th:href="@{/}">비회원 홈으로</a>
</header>
</body>
</html>
