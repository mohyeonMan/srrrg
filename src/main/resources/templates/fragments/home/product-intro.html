<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<body>
<!--
	이 화면의 목적은 "URL 하나를 붙여넣고 단축 링크를 받는다" 하나다.
	이전에는 사용자가 입력창에 닿기 전에 같은 메시지를 네 겹으로 읽어야 했다 —
	헤더 태그라인("빠르고 안전한, 무료 단축 URL") + 눈썹("srrrg.link") + h1 + 설명 두 문장.
	눈썹은 헤더 워드마크가 이미 말하는 도메인을 되풀이할 뿐이라 지웠고,
	설명은 발급되는 것(링크 + secret key)만 남겼다. 위협 차단은 아래 기능 목록이 담당한다.
-->
<section class="product-intro" th:fragment="productIntro" aria-labelledby="home-title">
	<h1 id="home-title" class="display-title">긴 링크를 짧고 안전하게</h1>
	<p class="intro-description">
		URL을 붙여넣으면 단축 링크와 관리용 secret key를 바로 발급합니다.
	</p>
</section>
</body>
</html>
