<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<body>
<section class="home-section manage-section" th:fragment="manageEntry" aria-labelledby="management-title">
	<div class="manage-copy">
		<h2 id="management-title">내 단축 링크 관리</h2>
		<p>단축 URL 또는 코드와 secret key를 입력하면 원본 URL, 만료 시각, 누적 통계를 확인할 수 있습니다.</p>
	</div>

	<form id="management-lookup-form" class="management-form" autocomplete="off" data-form-type="other" novalidate>
		<label class="field" for="lookup-link-ref">
			<span class="field-label">단축 URL 또는 코드</span>
			<input
					id="lookup-link-ref"
					class="field-input"
					type="text"
					placeholder="단축 URL 또는 코드"
					autocomplete="one-time-code"
					autocapitalize="none"
					autocorrect="off"
					spellcheck="false"
					data-1p-ignore
					data-lpignore="true"
					aria-describedby="management-message"
					required
			>
		</label>
		<label class="field" for="lookup-access-token">
			<span class="field-label">관리 키</span>
			<input
					id="lookup-access-token"
					class="field-input"
					type="text"
					placeholder="srrrg_sk_xxxxxxxxx"
					autocomplete="one-time-code"
					autocapitalize="none"
					autocorrect="off"
					spellcheck="false"
					data-1p-ignore
					data-lpignore="true"
					aria-describedby="management-message"
					required
			>
		</label>
		<button id="management-lookup-button" class="primary-button" type="submit">조회하기</button>
		<p id="management-message" class="management-message" role="status" aria-live="polite"></p>
	</form>
</section>
</body>
</html>
