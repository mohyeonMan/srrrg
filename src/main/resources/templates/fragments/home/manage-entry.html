<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<body>
<!--
	이미 링크를 만든 사람이 돌아오는 자리다. 새 링크를 만드는 것보다 빈도가 낮으므로
	제목 + 설명 + 버튼으로 된 한 섹션(약 120px)을 한 줄로 줄였다.
	헤더에도 같은 링크가 있지만 이쪽을 남기는 이유는, 비회원에게는 이것이
	발급받은 secret key 로 돌아올 수 있는 유일하게 설명이 붙은 경로이기 때문이다.
	필요한 정보는 "secret key 가 필요하다" 하나이므로 그것만 남겼다.
-->
<section class="home-section manage-section" th:fragment="manageEntry" aria-labelledby="management-title">
	<h2 id="management-title" class="manage-title">이미 만든 링크가 있나요?</h2>
	<p class="manage-hint">발급받은 secret key로 설정과 통계를 확인할 수 있습니다.</p>
	<a class="text-link manage-console-link" th:href="@{/manage}">링크 관리 열기</a>
</section>
</body>
</html>
