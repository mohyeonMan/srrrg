<!--
	프로젝트 내부 전용 조각입니다. 단독 페이지로 렌더링하지 않습니다.
	포함하는 화면(projects.html)이 srrrg-common.js / srrrg-project-members.js 를 불러옵니다.
	#member-project-name 은 srrrg-project-members.js 가 참조하므로 반드시 조각 안에 있어야 합니다.
-->
<div xmlns:th="http://www.thymeleaf.org" id="project-members-app" th:fragment="report">
	<!-- 활성 탭("멤버")이 패널 이름이고, 아래 h3 가 "멤버"·"초대" 를 각각 말한다.
	     프로젝트 이름은 페이지 제목에 있다. 제목 위계만 sr-only 로 남긴다. -->
	<h2 id="member-project-name" class="sr-only">멤버 및 초대</h2>
	<p id="members-message" class="form-message" role="status" aria-live="polite"></p>

	<section class="surface-panel project-card" aria-labelledby="member-list-title">
		<h3 id="member-list-title">멤버</h3>
		<div id="member-list" class="member-list"></div>
	</section>

	<section id="invitation-management" class="surface-panel project-card" aria-labelledby="invitation-title" hidden>
		<h3 id="invitation-title">초대</h3>
		<!-- "이메일로 초대 링크를 보냅니다" 는 바로 아래 폼(초대할 이메일 + 초대 보내기)이 이미 보여 준다.
		     남길 것은 전달 위험 하나다. -->
		<p class="invitation-help">초대 링크를 연 계정이 그대로 참여합니다. 링크를 다른 사람에게 전달하지 마세요.</p>
		<form id="invite-form" class="project-inline-form">
			<label class="field" for="invite-email"><span class="field-label">초대할 이메일</span><input id="invite-email" class="field-input" name="email" type="email" maxlength="320" autocomplete="email" aria-describedby="invite-message" required></label>
			<label class="field" for="invite-role"><span class="field-label">권한</span><select id="invite-role" class="field-input" name="role"><option value="EDITOR">링크 편집 가능</option><option value="VIEWER">조회 전용</option></select></label>
			<button id="invite-submit-button" class="primary-button" type="submit">초대 보내기</button>
		</form>
		<p id="invite-message" class="form-message" role="status" aria-live="polite"></p>
		<div class="invitation-list-heading"><h4>수락 대기</h4><span id="invitation-count" class="status-badge">0</span></div>
		<div id="invitation-list" class="invitation-list"></div>
	</section>
</div>
