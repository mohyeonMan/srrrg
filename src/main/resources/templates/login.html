<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>로그인 - srrrg</title>
	<link rel="stylesheet" th:href="@{/css/srrrg.css}">
</head>
<body>
<div th:replace="~{fragments/srrrg-layout :: header}"></div>

<main class="login-shell">
	<section class="login-card" aria-labelledby="login-title">
		<p class="eyebrow">계정 로그인</p>
		<h1 id="login-title">srrrg에 로그인</h1>
		<p class="login-description">사용할 계정을 선택하세요. 비밀번호는 srrrg에 저장되지 않습니다.</p>

		<p class="login-message" role="status" th:if="${param.link_required}">
			같은 이메일의 계정이 있습니다. 기존에 연결된 로그인 수단으로 다시 로그인하면 계정이 연결됩니다.
		</p>
		<p class="login-error" role="alert" th:if="${param.error}">
			로그인을 완료하지 못했습니다. OAuth 계정 상태와 서비스 설정을 확인해 주세요.
		</p>

		<nav class="oauth-options" aria-label="소셜 로그인">
			<a class="oauth-button" th:href="@{/oauth2/authorization/google}">Google로 계속</a>
			<a class="oauth-button" th:href="@{/oauth2/authorization/kakao}">Kakao로 계속</a>
			<a class="oauth-button" th:href="@{/oauth2/authorization/github}">GitHub로 계속</a>
		</nav>
	</section>
</main>

<div th:replace="~{fragments/srrrg-layout :: footer}"></div>
</body>
</html>
