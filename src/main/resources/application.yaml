server:
  shutdown: graceful

spring:
  application:
    name: srrrg
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/srrrg}
    username: ${SPRING_DATASOURCE_USERNAME:srrrg}
    password: ${SPRING_DATASOURCE_PASSWORD:srrrg-local-password}
  flyway:
    enabled: true
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

srrrg:
  base-url: ${SRRRG_BASE_URL:https://srrrg.link}
  trust-forwarded-headers: ${SRRRG_TRUST_FORWARDED_HEADERS:false}
  safe-browsing:
    api-key: ${GOOGLE_SAFE_BROWSING_API_KEY:}
    endpoint: ${GOOGLE_SAFE_BROWSING_ENDPOINT:https://safebrowsing.googleapis.com/v5/urls:search}
    connect-timeout: ${GOOGLE_SAFE_BROWSING_CONNECT_TIMEOUT:2s}
    read-timeout: ${GOOGLE_SAFE_BROWSING_READ_TIMEOUT:3s}

management:
  endpoint:
    health:
      probes:
        enabled: true
  endpoints:
    web:
      exposure:
        include: health,prometheus
