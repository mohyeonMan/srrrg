server:
  shutdown: graceful
  tomcat:
    mbeanregistry:
      enabled: true

spring:
  application:
    name: srrrg
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/srrrg}
    username: ${SPRING_DATASOURCE_USERNAME:srrrg}
    password: ${SPRING_DATASOURCE_PASSWORD:srrrg-local-password}
    hikari:
      maximum-pool-size: ${SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE:10}
      minimum-idle: ${SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE:10}
      connection-timeout: ${SPRING_DATASOURCE_HIKARI_CONNECTION_TIMEOUT:2000}
      validation-timeout: ${SPRING_DATASOURCE_HIKARI_VALIDATION_TIMEOUT:1000}
  flyway:
    enabled: true
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

srrrg:
  base-url: ${SRRRG_BASE_URL:https://srrrg.link}
  trust-forwarded-headers: ${SRRRG_TRUST_FORWARDED_HEADERS:false}
  url-risk:
    provider: ${SRRRG_URL_RISK_PROVIDER:google}
    fixed-safe:
      delay: ${SRRRG_URL_RISK_FIXED_SAFE_DELAY:0ms}
      cache-duration: ${SRRRG_URL_RISK_FIXED_SAFE_CACHE_DURATION:5m}
  safe-browsing:
    api-key: ${GOOGLE_SAFE_BROWSING_API_KEY:}
    endpoint: ${GOOGLE_SAFE_BROWSING_ENDPOINT:https://safebrowsing.googleapis.com/v5/urls:search}
    connect-timeout: ${GOOGLE_SAFE_BROWSING_CONNECT_TIMEOUT:2s}
    read-timeout: ${GOOGLE_SAFE_BROWSING_READ_TIMEOUT:3s}

management:
  endpoint:
    health:
      probes:
        enabled: true
  endpoints:
    web:
      exposure:
        include: health,prometheus
  metrics:
    distribution:
      percentiles-histogram:
        "http.server.requests": true
        "srrrg.redirect": true
        "srrrg.redirect.write": true
        "srrrg.link.create": true
        "srrrg.url.risk.check": true
      minimum-expected-value:
        "http.server.requests": 1ms
        "srrrg.redirect": 1ms
        "srrrg.redirect.write": 1ms
        "srrrg.link.create": 1ms
        "srrrg.url.risk.check": 1ms
      maximum-expected-value:
        "http.server.requests": 5s
        "srrrg.redirect": 5s
        "srrrg.redirect.write": 3s
        "srrrg.link.create": 10s
        "srrrg.url.risk.check": 5s
      slo:
        "http.server.requests": 10ms,25ms,50ms,100ms,250ms,500ms,1s,3s,5s
        "srrrg.redirect": 10ms,25ms,50ms,100ms,250ms,500ms,1s,3s,5s
        "srrrg.redirect.write": 5ms,10ms,25ms,50ms,100ms,250ms,500ms,1s,3s
        "srrrg.link.create": 25ms,50ms,100ms,250ms,500ms,1s,3s,5s,10s
        "srrrg.url.risk.check": 10ms,25ms,50ms,100ms,250ms,500ms,1s,3s,5s
